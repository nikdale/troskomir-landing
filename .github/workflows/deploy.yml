name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only for every job. The two write scopes the Pages deployment needs are
# granted to the `deploy` job alone, below: `build` runs npm scripts from the
# checked-out tree and has no business holding an OIDC token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm run validate:release
        env:
          PUBLIC_PLAY_STORE_URL: ${{ vars.PUBLIC_PLAY_STORE_URL }}
          PUBLIC_APP_STORE_URL: ${{ vars.PUBLIC_APP_STORE_URL }}

      - name: Type check
        run: npm run check

      - name: Build with Astro
        # `astro build` followed by scripts/apply-csp-hashes.mjs, which rewrites
        # each page's script-src into the SHA-256 of that page's own inline
        # scripts. Skip the second half and every page ships 'unsafe-inline'.
        run: npm run build
        env:
          # Self-hosted Umami (troskomir-bekend/deploy/analytics). Unset until
          # that stack is actually live — site-config.ts's envUrl() fallback
          # then omits the analytics script entirely rather than pointing it
          # at nothing, so this is safe to leave unset in the meantime.
          PUBLIC_ANALYTICS_URL: ${{ vars.PUBLIC_ANALYTICS_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}

      - name: Test the built site
        # This job publishes straight to the live site, so the guards run
        # against the exact dist/ that is about to be uploaded: a wrong CSP hash
        # silently kills the account-deletion form, and a dangling hreflang
        # alternate is a 404 in Search Console on the page Play re-checks.
        run: npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  verify-delete-account:
    # After the deploy, not before: this checks the live API from the live
    # origin, and Play verifies the deletion flow by visiting that page.
    # Side-effect free — a CORS preflight plus a POST with a deliberately
    # invalid body, so no account is touched and no mail is sent.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-delete-account-path.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
