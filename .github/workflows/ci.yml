name: ci

# Validates a pull request before it reaches main.
#
# Until this existed, nothing here ran `npm ci` or a build on a PR — only
# `filesystem-scan`. The Pages deploy runs on push to main, so a broken
# lockfile or a dependency conflict was only discovered *after* merging, with
# the live site's deploy red. That has now happened twice: once from an
# `npm audit fix` that pruned optional platform packages, and once from a
# TypeScript 7 bump that `@astrojs/check` cannot resolve against.
#
# `npm ci` is the specific check that catches both. It is stricter than
# `npm install`: it refuses to proceed when package.json and the lockfile
# disagree, which is exactly the class of breakage that was getting through.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: troskomir-landing-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: install + check + build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        # Not `npm install`: this must fail when the lockfile and package.json
        # disagree, rather than quietly rewriting the lockfile to make them
        # agree. The deploy runs `npm ci`, so this is the same gate.
        run: npm ci

      - name: Type-check
        # `astro check` — already a script and already passing, just never run
        # by CI. It is what would have caught a TypeScript major bump breaking
        # the four-language routing.
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        # After the build, never before: every test in tests/ reads the emitted
        # pages in dist/ rather than the source. That is deliberate — the things
        # they guard (the per-page CSP script-src hashes, the hreflang
        # alternates, the legal copy, the store links) are only decidable once
        # the HTML exists. Nothing ran them here until now, which is how a
        # comment claiming they gated the build stayed wrong for so long.
        run: npm test

      - name: Install the Playwright browser
        # Chromium only: e2e/ asserts layout, keyboard use, the CSP and axe
        # WCAG 2.1 AA, none of which differs by engine enough to triple the
        # job time. --with-deps pulls the system libraries the runner lacks.
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests (Playwright + axe)
        # Every page in every locale at three widths through axe, the 404 and
        # /open/ bridges, font and image budgets, and the deletion form against
        # a mocked API. It was red for weeks without anyone noticing because
        # nothing ran it (VELES V-A11Y-02). playwright.config.ts builds and
        # serves dist/ itself with production-like analytics values; every
        # https:// request is aborted, so nothing leaves the runner.
        run: npx playwright test

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
